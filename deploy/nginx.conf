# Nginx: reverse-proxy для mytasks + HTTPS (Let's Encrypt / certbot)
# Сервер node слушает 127.0.0.1:3000 (NODE_ENV=production).

server {
    listen 80;
    server_name tasks.example.ru;

    # Редирект на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tasks.example.ru;

    # Сертификаты (после certbot --nginx будут прописаны автоматически)
    ssl_certificate     /etc/letsencrypt/live/tasks.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tasks.example.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Для загрузки вложений (base64 до ~14 МБ на запрос)
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

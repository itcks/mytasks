# Apache 2.4: reverse-proxy для mytasks + HTTPS
# Требуемые модули:
#   a2enmod proxy proxy_http ssl headers rewrite
# Сервер node слушает 127.0.0.1:3000 (NODE_ENV=production).

<VirtualHost *:80>
    ServerName tasks.example.ru
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName tasks.example.ru

    SSLEngine on
    # Сертификаты (после certbot --apache будут прописаны автоматически)
    SSLCertificateFile      /etc/letsencrypt/live/tasks.example.ru/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/tasks.example.ru/privkey.pem

    # Для загрузки вложений (base64 до ~14 МБ на запрос)
    LimitRequestBody 16777216

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>

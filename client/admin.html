<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Админка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="theme.js"></script>
</head>
<body>
  <div class="container">
    <h1>Админка</h1>
    <p id="user-info"></p>
    <div style="text-align: right;">
      <button id="theme-toggle">🌙 Ночь</button>
      <a href="/index.html"><button>К задачам</button></a>
      <button id="logout-btn">Выйти</button>
    </div>

    <h2>Пользователи</h2>

    <form id="user-form" class="user-form">
      <div class="field">
        <label for="new-username">Имя пользователя</label>
        <input type="text" id="new-username" required />
      </div>
      <div class="field">
        <label for="new-password">Пароль</label>
        <input type="password" id="new-password" required />
      </div>
      <div class="field">
        <label for="new-role">Роль</label>
        <select id="new-role">
          <option value="user">user</option>
          <option value="engineer">engineer</option>
          <option value="admin">admin</option>
        </select>
      </div>
      <button type="submit">Добавить пользователя</button>
    </form>

    <table id="users-table">
      <thead>
        <tr><th>ID</th><th>Имя</th><th>Роль</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2>Отчёты</h2>
    <div class="sort-controls">
      <div class="field">
        <label for="report-from">С даты:</label>
        <input type="date" id="report-from" />
      </div>
      <div class="field">
        <label for="report-to">По дату:</label>
        <input type="date" id="report-to" />
      </div>
      <button id="report-btn">Показать</button>
    </div>
    <table id="report-totals">
      <thead><tr><th>Всего</th><th>Выполнено</th><th>В работе</th><th>Новых</th><th>Просрочено</th></tr></thead>
      <tbody></tbody>
    </table>
    <table id="report-engineers">
      <thead><tr><th>Исполнитель</th><th>Задач</th><th>Выполнено</th><th>Просрочено</th><th>Ср. время, ч</th></tr></thead>
      <tbody></tbody>
    </table>

    <div class="sort-controls">
      <label for="status-select">Статус:</label>
      <select id="status-select">
        <option value="active">Активные</option>
        <option value="done">Выполненные</option>
        <option value="all">Все</option>
      </select>
      <label for="limit-select">На странице:</label>
      <select id="limit-select">
        <option value="10">10</option>
        <option value="25">25</option>
        <option value="50">50</option>
      </select>
      <a href="/api/export/csv" download><button>Выгрузить CSV</button></a>
    </div>

    <table id="tasks-table">
      <thead>
        <tr>
          <th>Задача</th>
          <th>Автор</th>
          <th>Исполнитель</th>
          <th>Создано</th>
          <th>Срок</th>
          <th>Статус</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="pagination">
      <button id="prev-page">← Назад</button>
      <span id="page-info"></span>
      <button id="next-page">Вперёд →</button>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
